
}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - LinkJoe ICT Academy</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
  text-align:center;
margin-top:10px;
height:100vh;
background:linear-gradient(135deg,#000000,#0f62fe);
font-family:Arial,sans-serif;
position:relative;
}

.container{
width:350px;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:25px;
color:#0f62fe;
}

.input-box{
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.options{
display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:20px;
}

.options a{
text-decoration:none;
color:#0f62fe;
}

button{
width:100%;
padding:12px;
background:#0f62fe;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0043ce;
}

.signup{
text-align:center;
margin-top:20px;
}

.signup a{
text-decoration:none;
color:#0f62fe;
font-weight:bold;
}

#error{
color:red;

</style>

</head>
<body>

<div class="container">

<h2>Login</h2>

<div class="input-box">
<input type="email" id="email" placeholder="Email Address">
</div>

<div class="input-box">
<input type="password" id="password" placeholder="Password">
</div>

<div class="options">
<label>
<input type="checkbox">
Remember me
</label>

<a href="#">Forgot Password?</a>
</div>
...
<button id="login">Sign In</button>

<p id="message"></p>   <!-- changed from id="error" -->

<div class="signup">
  Don't have an account?
  <a href="#">Create Account</a>
</div>

</div>

<script type="module" src="Script.js"></script>
</body>
</html>
